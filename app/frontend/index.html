<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <title>Bíblia API</title>
</head>
<body id="body">
    <div id="bloco">
        <header>
            <h1>Bíblia API</h1>
            <p id="versao">Tradução: Bíblia Livre</p>
        </header>

        <div id="div-formulario">
            <form name="form1" id="form1" action="">
                <div class="campos">
                    <label for="livro">Livro</label>
                    <select name="livro" id="livro">
                        <option value="" selected="selected">Selecione o livro</option>
                    </select>

                    <label for="capitulo">Capítulo</label>
                    <select name="capitulo" id="capitulo">
                        <option value="" selected="selected">Selecione</option>
                    </select>

                    <label for="versiculo">Versículo</label>
                    <select name="versiculo" id="versiculo">
                        <option value="" selected="selected">Selecione</option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="botao-principal">Exibir versículo</button>
                    <button type="button" id="aleatorio" class="botao-secundario">Aleatório</button>
                </div>
            </form>

            <div id="div-resultado" aria-live="polite">
                <p id="resultado"></p>
            </div>
        </div>

        <footer>
            <p id="creditos">
                Texto bíblico da Bíblia Livre (BLIVRE), © Diego Santos, Mario Sérgio e Marco Teles, 2017.
                Licença <a href="http://creativecommons.org/licenses/by/3.0/br/">Creative Commons Atribuição 3.0 Brasil</a>.
                Reprodução permitida desde que mencionados fonte e autores.
            </p>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
